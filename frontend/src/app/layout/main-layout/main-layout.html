<div class="layout-container" [class.collapsed]="isSidebarCollapsed">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" [class.active]="isMobileSidebarActive()" (click)="toggleSidebar()"></div>

    <aside class="sidebar glass-card" [class.active]="isMobileSidebarActive()">
        <div class="sidebar-header">
            <div class="logo">
                @if (currentOrg()?.logo_url) {
                <img [src]="currentOrg()?.logo_url" alt="Logo" class="org-logo">
                } @else {
                <i class="bi bi-rocket-takeoff-fill"></i>
                }
                <span>{{ currentOrg()?.name || 'TaskManagement' }}</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            @for (item of navItems(); track item.label) {
            <a [routerLink]="item.route" routerLinkActive="active"
                [routerLinkActiveOptions]="{exact: item.route === '/'}" class="nav-item">
                <i [class]="'bi ' + item.icon"></i>
                <span>{{ item.label }}</span>
            </a>
            }
        </nav>

        <div class="sidebar-footer">
            <button class="logout-btn" title="Logout" (click)="logout()"
                style="width: 100%; display: flex; justify-content: center; gap: 0.75rem; align-items: center;">
                <i class="bi bi-box-arrow-right"></i>
                <span class="logout-text">Logout</span>
            </button>
        </div>
    </aside>

    <div class="main-content">
        <header class="top-navbar glass-card">
            <div class="navbar-left">
                <button class="menu-btn" (click)="toggleSidebar()">
                    <i class="bi" [class.bi-text-indent-left]="!isSidebarCollapsed"
                        [class.bi-text-indent-right]="isSidebarCollapsed"></i>
                </button>
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Search for tasks, branches...">
                </div>
            </div>
            <div class="navbar-right">
                <div class="user-profile header-profile" routerLink="/profile" style="cursor: pointer;">
                    <div class="avatar small">
                        <img *ngIf="currentUser()?.profile_photo_url" [src]="currentUser()?.profile_photo_url"
                            alt="User">
                        <span *ngIf="!currentUser()?.profile_photo_url">{{ currentUser()?.full_name?.charAt(0) || 'U'
                            }}</span>
                    </div>
                    <div class="user-info hide-mobile">
                        <span class="name">{{ currentUser()?.full_name || 'Operational Agent' }}</span>
                        <span class="role">{{ currentUser()?.role_name || 'Member' }}</span>
                    </div>
                </div>
                <button class="icon-btn"><i class="bi bi-bell-fill"></i></button>
                <button class="icon-btn"><i class="bi bi-question-circle-fill"></i></button>
            </div>
        </header>

        <main class="page-content">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
