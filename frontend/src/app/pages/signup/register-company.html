<div class="signup-container">
    <div class="signup-card">
        <div class="signup-header">
            <h1>{{ 'REGISTER_ORG' | translate }}</h1>
            <p>{{ 'NEED_WORKSPACE' | translate }}</p>
        </div>

        <form (ngSubmit)="onSubmit()" #regForm="ngForm" class="signup-form">
            <div class="form-group">
                <label for="orgName">{{ 'ORGANIZATION' | translate }}</label>
                <div class="input-wrapper">
                    <input type="text" id="orgName" name="orgName" [(ngModel)]="orgName" required
                        [placeholder]="'ORGANIZATION' | translate">
                </div>
            </div>

            <div class="form-group">
                <label for="adminFullName">{{ 'FULL_NAME' | translate }}</label>
                <div class="input-wrapper">
                    <input type="text" id="adminFullName" name="adminFullName" [(ngModel)]="adminFullName" required
                        [placeholder]="'FULL_NAME' | translate">
                </div>
            </div>

            <div class="form-group">
                <label for="adminEmail">{{ 'EMAIL_ADDRESS' | translate }}</label>
                <div class="input-wrapper">
                    <input type="email" id="adminEmail" name="adminEmail" [(ngModel)]="adminEmail" required
                        [placeholder]="'EMAIL_ADDRESS' | translate">
                </div>
            </div>

            <div class="form-group">
                <label for="adminPassword">{{ 'PASSWORD' | translate }}</label>
                <div class="input-wrapper">
                    <input type="password" id="adminPassword" name="adminPassword" [(ngModel)]="adminPassword" required
                        placeholder="••••••••">
                </div>
            </div>

            <div *ngIf="error" class="alert-premium alert-error">
                <i class="bi bi-shield-exclamation"></i> {{ error }}
            </div>

            <button type="submit" class="premium-btn signup-btn" [disabled]="loading || !regForm.form.valid">
                <span *ngIf="!loading">{{ 'REGISTER_ORG' | translate }}</span>
                <span *ngIf="loading" class="loader"></span>
            </button>
        </form>

        <div class="signup-footer">
            <p>{{ 'ALREADY_HAVE_ACCOUNT' | translate }} <a routerLink="/login">{{ 'SIGN_IN' | translate }}</a></p>
            <p style="margin-top: 1rem; font-size: 0.85rem; opacity: 0.8;">
                {{ 'JOIN_ORG' | translate }} <a routerLink="/signup">{{ 'SIGN_UP' | translate }}</a>
            </p>
        </div>
    </div>
</div>
