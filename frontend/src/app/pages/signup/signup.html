<div class="signup-container">
    <div class="signup-card">
        <div class="signup-header">
            <h1>SIGN UP</h1>
            <p *ngIf="!isInvited()">Join an existing organization</p>
            <p *ngIf="isInvited()" style="color: #4ade80; font-weight: 700;">
                You've been invited to join {{ invitedOrgName() }}
            </p>
        </div>

        <form (ngSubmit)="onSubmit()" #signupForm="ngForm" class="signup-form">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" name="fullName" [(ngModel)]="fullName" required
                        placeholder="Your full name">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" [(ngModel)]="email" required
                        placeholder="user@company.com" [disabled]="isInvited()">
                </div>
            </div>

            <div class="form-group" [style.display]="isInvited() ? 'none' : 'block'">
                <label for="organization">Organization</label>
                <div class="input-wrapper select-wrapper">
                    <select id="organization" name="organization" [(ngModel)]="orgId" required>
                        <option [ngValue]="null" disabled selected>Select organization</option>
                        @for (org of organizations(); track org.id) {
                        <option [value]="org.id">{{ org.name }}</option>
                        }
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" [(ngModel)]="password" required
                        placeholder="••••••••">
                </div>
            </div>

            <div *ngIf="error" class="alert-premium alert-error">
                <i class="bi bi-shield-exclamation"></i> {{ error }}
            </div>

            <button type="submit" class="premium-btn signup-btn" [disabled]="loading || !signupForm.form.valid">
                <span *ngIf="!loading">CREATE ACCOUNT</span>
                <span *ngIf="loading" class="loader"></span>
            </button>
        </form>

        <div class="signup-footer">
            <p>Already have an account? <a routerLink="/login">Sign In</a></p>
            <p style="margin-top: 1rem; font-size: 0.85rem; opacity: 0.8;">
                Need a new workspace? <a routerLink="/register-company">Register Organization</a>
            </p>
        </div>
    </div>
</div>
