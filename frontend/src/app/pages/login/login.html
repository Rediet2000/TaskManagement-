<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>{{ 'LOGIN' | translate }}</h1>
            <p>{{ 'ACCESS_WORKSPACE' | translate }}</p>
        </div>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
            <div class="form-group">
                <label for="email">{{ 'EMAIL_ADDRESS' | translate }}</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" [(ngModel)]="email" required
                        placeholder="user@company.com">
                </div>
            </div>

            <div class="form-group">
                <label for="password">{{ 'PASSWORD' | translate }}</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" [(ngModel)]="password" required
                        placeholder="••••••••">
                </div>
                <div class="field-actions">
                    <a routerLink="/forgot-password" class="forgot-password-link">{{ 'FORGOT_PASSWORD' | translate
                        }}</a>
                </div>
            </div>

            <div *ngIf="error" class="alert-premium alert-error">
                <i class="bi bi-shield-exclamation"></i> {{ error }}
            </div>

            <div *ngIf="route.snapshot.queryParams['signedUp']" class="alert-premium alert-success">
                <i class="bi bi-check-circle"></i> {{ 'SIGNUP_SUCCESS' | translate }}
            </div>

            <button type="submit" class="premium-btn login-btn" [disabled]="loading">
                <span *ngIf="!loading">{{ 'SIGN_IN' | translate }}</span>
                <span *ngIf="loading" class="loader"></span>
            </button>
        </form>

        <div class="login-footer">
            <p>{{ 'NEW_USER' | translate }} <a routerLink="/signup">{{ 'CREATE_ACCOUNT' | translate }}</a></p>
            <p style="margin-top: 1rem; font-size: 0.85rem; opacity: 0.8;">
                {{ 'NEED_WORKSPACE' | translate }} <a routerLink="/register-company">{{ 'REGISTER_ORG' | translate
                    }}</a>
            </p>
        </div>
    </div>
</div>
